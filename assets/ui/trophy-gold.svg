  <!-- Stem -->
  <rect x="57" y="78" width="14" height="18" rx="3" fill="url(#trophyGrad)"/>
  <rect x="44" y="94" width="40" height="8" rx="4" fill="url(#trophyGrad)"/>
  <!-- Pedestal -->
