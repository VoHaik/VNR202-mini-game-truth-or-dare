      <stop offset="0%" stop-color="#fff4b8"/>
      <stop offset="40%" stop-color="#ffd000"/>
      <stop offset="100%" stop-color="#d47a00"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
