<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="goldGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe57f" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#ffcc00" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff8800" stop-opacity="0.15"/>
    </radialGradient>
  </defs>
  <g fill="none" stroke="url(#goldGrad)" transform="translate(300,300)">
    <!-- Concentric Dong Son Drum Rings -->
    <circle r="285" stroke-width="2" stroke-dasharray="6 4"/>
    <circle r="270" stroke-width="3"/>
    <circle r="240" stroke-width="1.5"/>
    <circle r="225" stroke-width="10" stroke-dasharray="2 12"/>
    <circle r="205" stroke-width="2"/>
    <circle r="175" stroke-width="1.5" stroke-dasharray="16 8"/>
    <circle r="150" stroke-width="2.5"/>
    <circle r="120" stroke-width="8" stroke-dasharray="4 10"/>
    <circle r="95" stroke-width="2"/>
    <circle r="65" stroke-width="1.5"/>
    <circle r="38" stroke-width="2.5"/>

    <!-- Geometric Rays & Bird-inspired Motifs -->
    <g stroke-width="1.5" opacity="0.75">
      <line x1="-270" y1="0" x2="270" y2="0"/>
      <line x1="0" y1="-270" x2="0" y2="270"/>
      <line x1="-191" y1="-191" x2="191" y2="191"/>
      <line x1="-191" y1="191" x2="191" y2="-191"/>
      <line x1="-249" y1="-103" x2="249" y2="103"/>
      <line x1="-103" y1="-249" x2="103" y2="249"/>
      <line x1="-249" y1="103" x2="249" y2="-103"/>
      <line x1="-103" y1="249" x2="103" y2="-249"/>
    </g>

    <!-- 12-Pointed Central Dong Son Sun Star -->
    <polygon fill="url(#goldGrad)" stroke-width="1.5" points="
      0,-62 11,-22 31,-53 20,-15 53,-31 23,-4
      62,0 23,4 53,31 20,15 31,53 11,22
      0,62 -11,22 -31,53 -20,15 -53,31 -23,4
      -62,0 -23,-4 -53,-31 -20,-15 -31,-53 -11,-22
    "/>
    <circle r="12" fill="#fff3b0"/>
  </g>
</svg>
